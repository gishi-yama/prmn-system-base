vaadin.launch-browser=true
spring.application.name=front-vaadin
server.port=8080

# ======================================
# Azure AD OAuth2 Configuration
# ======================================
# This section configures Azure AD (Entra ID) authentication using OAuth2/OIDC.
#
# Required Environment Variables:
#   AZURE_AD_TENANT_ID  - Your Azure AD tenant ID (e.g., "12345678-1234-1234-1234-123456789012")
#   AZURE_AD_CLIENT_ID  - The Application (client) ID of your registered app
#   AZURE_AD_CLIENT_SECRET - The client secret for your registered app
# ======================================

# Internal reference for registration ID
app.security.azure.registration-id=azure
# Azure AD Tenant ID - identifies your organization's directory
app.security.azure.tenant-id=${AZURE_AD_TENANT_ID}

# OAuth2 client registration settings
# Client ID - the unique identifier for your application in Azure AD
spring.security.oauth2.client.registration.azure.client-id=${AZURE_AD_CLIENT_ID:00000000-0000-0000-0000-000000000000}
# Client Secret - used to authenticate your app to Azure AD (keep this secure!)
spring.security.oauth2.client.registration.azure.client-secret=${AZURE_AD_CLIENT_SECRET:dummy-secret}
spring.security.oauth2.client.registration.azure.client-name=Azure AD
spring.security.oauth2.client.registration.azure.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.azure.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# Scopes: openid (required for OIDC), profile (user info), email (user email)
spring.security.oauth2.client.registration.azure.scope=openid,profile,email

# OAuth2 provider endpoints for Azure AD
spring.security.oauth2.client.provider.azure.authorization-uri=https://login.microsoftonline.com/${app.security.azure.tenant-id}/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.azure.token-uri=https://login.microsoftonline.com/${app.security.azure.tenant-id}/oauth2/v2.0/token
spring.security.oauth2.client.provider.azure.jwk-set-uri=https://login.microsoftonline.com/${app.security.azure.tenant-id}/discovery/v2.0/keys
spring.security.oauth2.client.provider.azure.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.azure.user-name-attribute=name
